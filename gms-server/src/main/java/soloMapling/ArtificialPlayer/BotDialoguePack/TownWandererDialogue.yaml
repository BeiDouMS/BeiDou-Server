# Shared ambient dialogue for the generic TownWandererBot (roams every town except Henesys, which keeps
# its hand-polished HenesysBot lines). Lines use the {MAP} context token so the same file reads correctly
# in Kerning, Ellinia, Perion, Sleepywood, Orbis, Ludibrium, El Nath. Keep lines town-agnostic — no
# Henesys-specific references. Per-town flavor files can come later via the dialogue batch playbook.
TownWandererBot:
  CongratsLevelUp:
    text:
      - "gratz {PLAYER_NAME}!"
      - "nice, level {PLAYER_LEVEL}"
      - "gz gz"
      - "ayy congrats {PLAYER_NAME}"
      - "lv {PLAYER_LEVEL} already? nice"
      - "keep grinding {PLAYER_NAME}"
      - "wtg"
      - "grats on the level up"
      - "nice one {PLAYER_NAME}"
      - "oh a level up, gratz {PLAYER_NAME}"
      - "lets go {PLAYER_NAME}"
      - "level {PLAYER_LEVEL}, not bad"
      - "gz {PLAYER_NAME}, keep it up"
      - "nice climb to {PLAYER_LEVEL}"
  PlayerReaction:
    text:
      - "oh hey"
      - "sup"
      - "hi there"
      - "yo"
      - "just passing through"
      - "scuse me"
      - "havent seen u around {MAP} before"
      - "wait do I know you?"
      - "hey watch it lol"
      - "nice day in {MAP} huh"
      - "you new around here?"
      - "hm?"
      - "oh its you again lol"
      - "whatcha up to"
      - "wb"
      - "been quiet in {MAP} today"
      - "careful out there"
      - "wanna team up sometime?"
      - "*waves*"
      - "long time no see"
  WanderChat:
    text:
      - "ok where was I going"
      - "hmm which way"
      - "just stretching my legs"
      - "{MAP} is pretty nice actually"
      - "la la la~"
      - "wonder whats on sale today"
      - "so many people in {MAP} lately"
      - "I should really get back to training"
      - "*yawn*"
      - "nice and quiet here"
      - "love this part of {MAP}"
      - "where is everyone"
      - "another lap around {MAP}"
      - "this town never changes"
      - "I need more mesos..."
      - "wonder if the shop restocked"
      - "hmm"
      - "just killing time"
  EmoteReaction:
    text:
      - "haha"
      - "lol"
      - "nice"
      - "oh?"
      - "hm!"
      - "heh"
      - "well then"
      - "interesting"
      - "no way"
      - ":)"
  MapTransition:
    text:
      - "gonna wander off for a bit"
      - "off to explore, cya"
      - "brb checking somewhere"
      - "think I'll head over the way"
      - "seeya around {MAP}"
      - "time to move on"
      - "catch you later"
      - "gonna go stretch my legs elsewhere"
      - "somewhere new sounds good"
      - "wandering off~"
